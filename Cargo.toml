[workspace]
resolver = "3"
members = ["server", "tools/poolctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.9"
