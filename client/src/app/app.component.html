<header class="masthead">
  <div class="shell masthead__inner">
    <a class="wordmark" routerLink="/">vriltrainer</a>

    <nav class="nav" aria-label="Hauptnavigation">
      <a routerLink="/trial" routerLinkActive="is-active">Sitzung</a>
      <a routerLink="/statistik" routerLinkActive="is-active">Statistik</a>
      <a routerLink="/rangliste" routerLinkActive="is-active">Rangliste</a>
    </nav>

    <div class="masthead__right">
      <div class="keybox" [class.keybox--open]="keyRevealed">
        <span class="keybox__label">Zugang</span>
        <code class="keybox__value">{{ maskedKey }}</code>
        <button class="keybox__btn" type="button" (click)="copyKey()" title="Kopieren, ohne anzuzeigen">
          Kopieren
        </button>
        <button class="keybox__btn" type="button" (click)="toggleKey()">
          {{ keyRevealed ? 'Verbergen' : 'Anzeigen' }}
        </button>
      </div>
      <a class="lang" href="https://vriltrainer.com" hreflang="en">EN</a>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="shell">
    <app-null-line [deviation]="0.31" label="Aggregat, alle Sitzungen" reading="12,53 % · n = 148.213" />
    <p class="footer__note faint">
      Nulllinie = 12,5 %. Jede Zahl auf dieser Seite ist ein Ausschlag davon.
      Der Datensatz ist vollständig herunterladbar; nachrechnen ist ausdrücklich vorgesehen.
    </p>
  </div>
</footer>
