<header class="hud">
  <div class="shell hud__inner">
    <a class="mark" routerLink="/">
      <span class="mark__vril">Vril</span><span class="mark__trainer">trainer</span>
    </a>

    <nav class="tabs" aria-label="Hauptnavigation">
      <a routerLink="/trial" routerLinkActive="is-active">Sitzung</a>
      <a routerLink="/statistik" routerLinkActive="is-active">Statistik</a>
      <a routerLink="/rangliste" routerLinkActive="is-active">Rangliste</a>
    </nav>

    <div class="hud__right">
      @if (demoMode) {
        <span class="demo" title="Ohne Server: Koordinaten und Ergebnisse entstehen hier im Browser">
          Demo
        </span>
      }

      <!-- The access key is the save file, so it is labelled as one. -->
      <div class="save" [class.save--open]="keyRevealed">
        <span class="save__label">Spielstand</span>
        <code class="save__value">{{ maskedKey }}</code>
        <button class="save__btn" type="button" (click)="copyKey()" title="Kopieren, ohne anzuzeigen">
          Kopieren
        </button>
        <button class="save__btn" type="button" (click)="toggleKey()">
          {{ keyRevealed ? 'Verbergen' : 'Zeigen' }}
        </button>
      </div>

      <a class="lang" href="https://vriltrainer.com" hreflang="en">EN</a>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  <div class="shell">
    <app-vril-meter
      [deviation]="0.31"
      label="Alle Spieler, alle Sitzungen"
      reading="12,53 % · n = 148.213"
      needleLabel="alle"
    />
    <p class="foot__note">
      Die Nulllinie liegt bei 12,5 % — reines Raten. Jede Zahl hier ist ein Ausschlag davon, und
      bisher schlägt nichts aus. Der komplette Datensatz ist herunterladbar; nachrechnen ist
      ausdrücklich vorgesehen.
    </p>
  </div>
</footer>
