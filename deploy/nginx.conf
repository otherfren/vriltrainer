# vriltrainer — both domains, one upstream.
#
# Two headers are load-bearing. Without a forwarded client address the service sees 127.0.0.1 for
# everyone, so the per-address limit on account creation is either inert or throttles all users
# together. Without an unchanged Host it cannot pick the locale bundle, because that is the only
# thing D10 selects on.

upstream vriltrainer {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name vriltrainer.de vriltrainer.com;

    # ssl_certificate     /etc/letsencrypt/live/vriltrainer.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vriltrainer.de/privkey.pem;

    # The access token lives in the URL fragment and is never sent to a server. Referrer policy
    # keeps it out of other people's logs too, when a user follows a link off the site.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://vriltrainer;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;              # locale selection (D10)
        proxy_set_header X-Real-IP         $remote_addr;       # account-creation limit (D17)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # The public record is large and immutable per sequence range. Cache it.
    location /api/log {
        proxy_pass http://vriltrainer;
        proxy_set_header Host $host;
        proxy_cache_valid 200 5m;
    }
}

server {
    listen 80;
    server_name vriltrainer.de vriltrainer.com;
    return 301 https://$host$request_uri;
}
