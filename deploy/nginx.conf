# vriltrainer — two domains, two upstreams, one database behind them.
#
# Since D24 the language is fixed by the `--locale` flag each process was started with, not by the
# Host header. That deleted a silent failure mode: a misconfigured proxy used to serve the wrong
# language, and now a German process cannot serve English at all. Host is still forwarded, but only
# so a process can log a warning when it is handed the other domain's traffic; nothing selects a
# language from it, and removing it would cost the warning and nothing else.
#
# One header remains load-bearing and still breaks silently: without a forwarded client address
# the service sees 127.0.0.1 for everyone, so the limit on account creation is either inert or
# throttles all users together. It must match --trusted-proxy in the unit file.

upstream vriltrainer_de {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream vriltrainer_en {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name vriltrainer.de;

    # ssl_certificate     /etc/letsencrypt/live/vriltrainer.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vriltrainer.de/privkey.pem;

    # The access token lives in the URL fragment and is never sent to a server. Referrer policy
    # keeps it out of other people's logs too, when a user follows a link off the site.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://vriltrainer_de;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # The public record is large and immutable per sequence range, so it is worth caching — but not
    # here and not like this. `proxy_cache_valid` without a `proxy_cache_path`/`proxy_cache` pair is
    # inert, and switched on as written the prefix also catches /api/log/head, where a five minute
    # old answer is a false statement about the state of an audit log. Add a cache zone that names
    # the ranged routes explicitly, or leave it uncached.
    location /api/log {
        proxy_pass http://vriltrainer_de;
        proxy_set_header Host $host;
    }

    # Never cached. This is the only privileged surface in the system (D25), and what bounds it is
    # that everything it can do is reversible — not that it is hard to reach.
    location /admin/ {
        proxy_pass http://vriltrainer_de;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    server_name vriltrainer.com;

    # ssl_certificate     /etc/letsencrypt/live/vriltrainer.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vriltrainer.com/privkey.pem;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://vriltrainer_en;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # See the note on the German block: no cache is better than an inert one that would, once
    # switched on, serve a stale /api/log/head.
    location /api/log {
        proxy_pass http://vriltrainer_en;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://vriltrainer_en;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name vriltrainer.de vriltrainer.com;
    return 301 https://$host$request_uri;
}
