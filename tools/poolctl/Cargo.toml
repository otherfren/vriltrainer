[package]
name = "poolctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
time.workspace = true
# The manifest type, its hash rule and the derivation's requirements live in the server crate. A
