# The pool, as a list you edit rather than a hundred and sixty command lines.
#
#   poolctl import          reads this file and pool/categories.toml
#   poolctl check           says what would stop a version being cut
#   poolctl build --version 1
#
# Every path is relative to THIS FILE, under `base`. The folder layout below `base` is yours —
# arrange it by subject, by source, by the afternoon you collected them. Nothing downstream sees
# it: an image's identity is the hash of its normalised bytes, and its category is what the entry
# says, not what folder it sits in. That is deliberate, so that reorganising your folders is never
# a silent re-categorisation of the pool.
#
# Requirements per image:
#   file      the source image. Shortest edge at least 512px — anything smaller would have to be
#             upscaled, and invented detail is exactly the difference that marks one of the eight.
#             JPEG, PNG or WebP. **AVIF and HEIC are not decodable** — see the note at the bottom.
#   category  must be declared in categories.toml
#   de / en   what the image is called, both required
#   source    the PAGE it was found on, not the direct file link. The licence is stated on the page.
#   licence   CC0, CC0-1.0, PD, PDM, UNSPLASH or PEXELS. Anything demanding a visible credit is
#             refused: that credit would appear beside one image and mark it.
#
# You never name the output. Everything is centre-cropped square, resized to 512x512, flattened,
# requantised to 5 bits per channel and re-encoded as PNG with all metadata stripped, and the id is
# the hash of those bytes. Re-running import is safe: an image already held is skipped.

base = "originals"

[defaults]
# Deliberately NOT set here. A licence is a legal claim about a specific file, and a default turns
# it into one made by omission for every image you ever add. State it per entry, or per group when
# a whole folder genuinely came from one place under one licence.

# ---------------------------------------------------------------------------
# Groups share a folder and whatever fields you set on them. An entry always
# wins over its group, and a group over [defaults].
#
#   [[group]]
#   dir = "landschaft"
#   category = "landscape"
#   licence = "CC0"
#
#     [[group.image]]
#     file = "strand-sylt.jpg"
#     de = "Strand bei Sonnenuntergang"
#     en = "Beach at sunset"
#     source = "https://commons.wikimedia.org/wiki/File:Beach_sunset.jpg"
#
#     [[group.image]]
#     file = "hochgebirge/gipfel.jpg"     # subfolders inside a group are just more path
#     de = "Berggipfel im Nebel"
#     en = "Mountain summit in fog"
#     source = "https://commons.wikimedia.org/wiki/File:Summit.jpg"
# ---------------------------------------------------------------------------

# All five came from Unsplash, so they share a licence and a source and belong in one group
# rather than repeating both five times. `dir` is omitted: they sit directly under `base`.
#
# `source` is the site, not the photo page, because Unsplash's CDN strips attribution metadata and
# the original slugs went with the renaming. That is enough to stand up the licence — the Unsplash
# Licence is site-wide — but it is not enough to find the photograph again. When you know a photo's
# page, `poolctl annotate <id> --source <url>` puts it on the record without a reimport.

[[group]]
licence = "UNSPLASH"
source = "https://unsplash.com"

  [[group.image]]
  file = "cntower.avif"
  category = "building"
  de = "Fernsehturm CN Tower, Toronto"
  en = "CN Tower, Toronto"

  # Both flower entries are in `plant` on purpose. It looks like the wrong call — two similar
  # images in one bucket — and it is the opposite: D22 draws eight DIFFERENT categories per trial,
  # so two images sharing a category can never appear in the same set. Splitting them across
  # `plant` and `landscape` is what would let a confusable pair turn up together.
  [[group.image]]
  file = "orange_narzissen.avif"
  category = "plant"
  de = "Orangefarbene Narzissen"
  en = "Orange daffodils"

  [[group.image]]
  file = "feld_gelbe_tulpen.avif"
  category = "plant"
  de = "Feld mit gelben Tulpen"
  en = "Field of yellow tulips"

  [[group.image]]
  file = "steine_pastelfarben.avif"
  category = "stone"
  de = "Pastellfarbene Kieselsteine"
  en = "Pastel-coloured pebbles"

  [[group.image]]
  file = "diskokugel_schwarz_weiss.avif"
  category = "ornament"
  de = "Diskokugel in Schwarzweiß"
  en = "Mirror ball in black and white"

# ---------------------------------------------------------------------------
# AVIF
#
# All five files above are AVIF, and poolctl cannot decode them. The `image` crate is built with
# `default-features = false, features = ["jpeg", "png", "webp"]`, and AVIF decoding needs its
# `avif-native` feature, which links libdav1d — a C library. This machine has the dav1d runtime
# but no headers, and no meson or ninja to build it, so the feature cannot be turned on here.
#
# Two ways forward, and the first is much cheaper:
#
#   1. Save them as JPEG, PNG or WebP and change the extensions above. Nothing else changes —
#      identity is the hash of the NORMALISED bytes, so the source format never mattered anyway.
#
#   2. `sudo apt install libdav1d-dev meson ninja-build`, then poolctl gets AVIF support in one
#      line of Cargo.toml. Worth it if you are collecting from sites that serve AVIF by default,
#      which is increasingly all of them. It costs the tool a C dependency; the SERVER stays a
#      static binary either way, because poolctl never ships.
# ---------------------------------------------------------------------------
