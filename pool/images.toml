# The pool, as a list you edit rather than a hundred and sixty command lines.
#
#   poolctl import          reads this file and pool/categories.toml
#   poolctl check           says what would stop a version being cut
#   poolctl build --version 1
#
# Every path is relative to THIS FILE, under `base`. The folder layout below `base` is yours —
# arrange it by subject, by source, by the afternoon you collected them. Nothing downstream sees
# it: an image's identity is the hash of its normalised bytes, and its category is what the entry
# says, not what folder it sits in. That is deliberate, so that reorganising your folders is never
# a silent re-categorisation of the pool.
#
# Requirements per image:
#   file      the source image. Shortest edge at least 512px — anything smaller would have to be
#             upscaled, and invented detail is exactly the difference that marks one of the eight.
#             JPEG, PNG or WebP. AVIF and HEIC cannot be decoded — convert them first.
#   category  must be declared in categories.toml
#   de / en   what the image is called, both required
#   source    the PAGE it was found on, not the direct file link. The licence is stated on the page.
#   licence   CC0, CC0-1.0, PD, PDM, UNSPLASH or PEXELS. Anything demanding a visible credit is
#             refused: that credit would appear beside one image and mark it.
#
# You never name the output. Everything is centre-cropped square, resized to 512x512, flattened,
# requantised to 5 bits per channel and re-encoded as PNG with all metadata stripped, and the id is
# the hash of those bytes. Re-running import is safe: an image already held is skipped.

base = "images"

# Every image here came from Unsplash. These are a claim about a specific file, so when you add a
# folder from anywhere else, OVERRIDE both on its group — a default that quietly follows an image
# from another source is a false licence claim, and this file is your defence if one is questioned.
[defaults]
licence = "UNSPLASH"
source = "https://unsplash.com"

# One group per category folder. `dir` is the folder, `category` is what the images ARE — they
# happen to match here because the folders are organised by subject, and nothing requires that.
# Rename a folder and the pool is unchanged; change a `category` and every future draw changes.

[[group]]
dir = "building"
category = "building"

  [[group.image]]
  file = "cntower.jpg"
  de = "Fernsehturm CN Tower, Toronto"
  en = "CN Tower, Toronto"

  # Four towers, and two cabins, all in one category. Both pairs would be confusable side by side, and
  # sharing a category is exactly what stops that: D22 draws eight DIFFERENT categories per trial,
  # so images filed together can never appear in the same set. Near-duplicates belong together, not
  # spread out — which is the opposite of what a tidy taxonomy would tell you to do.
  [[group.image]]
  file = "Eifelturm.jpg"
  de = "Eiffelturm in Paris"
  en = "Eiffel Tower, Paris"

  [[group.image]]
  file = "hütte_im_wald.jpg"
  de = "Hütte im Wald"
  en = "Cabin in the woods"

  [[group.image]]
  file = "insel_mit_hütte.jpg"
  de = "Kleine Insel mit Hütte"
  en = "Small island with a cabin"

  [[group.image]]
  file = "orient_pearl_shanghai_china.jpg"
  de = "Oriental Pearl Tower, Shanghai"
  en = "Oriental Pearl Tower, Shanghai"

  [[group.image]]
  file = "tokio-turm_blauer_himmel.jpg"
  de = "Tokyo Tower vor blauem Himmel"
  en = "Tokyo Tower against a blue sky"

  # A second Eiffel Tower. Two photographs of one landmark are the strongest case there is for
  # filing by resemblance: nothing else in the pool could be mistaken for each other more.
  [[group.image]]
  file = "eifel_tower.jpg"
  de = "Eiffelturm, Aufsicht von unten"
  en = "Eiffel Tower, seen from below"

  [[group.image]]
  file = "modern_house_green_field.jpg"
  de = "Modernes Haus auf grüner Wiese"
  en = "Modern house in a green field"

  # Four dwellings now, and two of them are dark cabins in trees. `building` has stopped being a
  # category and become the bucket that holds everything a viewer might mistake for something else
  # in it — which is what a category is for here.
  [[group.image]]
  file = "black_cabin_woods.jpg"
  de = "Schwarze Hütte im Wald"
  en = "Black cabin in the woods"

  [[group.image]]
  file = "wooden_house_surrounded_by_pine_trees.jpg"
  de = "Holzhaus zwischen Kiefern"
  en = "Wooden house among pines"

  [[group.image]]
  file = "large_ferris_wheel.jpg"
  de = "Großes Riesenrad"
  en = "Large ferris wheel"

