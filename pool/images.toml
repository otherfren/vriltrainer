# Thirteen pieces of Rijksmuseum jewellery, which is what finally fills `ornament` — it stood at
# three, the thinnest shelf in the pool, because clean cut-out photographs of decorative objects
# are exactly what a keyword search on Commons does not have.
#
# The filter that did the work here was subject, not licence. A pendant is only usable if it is not
# *also* something else: everything shaped like a mermaid, a dragon, a toad, a cannon or a pistol
# went back, and so did every one carrying a face — a bust, a Madonna head, a coin portrait — since
# those belong to `person`, `animal` and `weapon` and would put a confusable pair in one trial.
