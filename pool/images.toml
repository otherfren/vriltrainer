# Six from the Rijksmuseum instrument collection. What went back is the useful part of this round:
# a cymbal that is a plain brown disc and reads as a lid, a horn mute that is a blue cone, a
# bronze rattle that reads as a lidded urn, a gilt bell that reads as a mushroom, and a castanet
# with a museum label stuck to it. Recognisable as an instrument is a higher bar than "is one".
