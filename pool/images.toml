# Six instruments, and almost every one of them has a twin in here: two strings, two horns, and a
# drum kit that is nothing like either. That is the category working as intended — a viewer asked
# to tell a violin from a double bass at a glance is being tested on eyesight, not on anything else.
[[group]]
