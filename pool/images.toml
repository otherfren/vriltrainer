#
# Four collections that sound right and are not: `PD US FSA/OWI` is a licence category holding
# aircraft and coastal guns; Brady's plates are uncut multiple exposures, four to eight portraits in
# one frame; the Bain collection is press photography; and `Portrait photographs in the National
# Photo Company Collection` is outdoor shots with props — a mace, a shotgun, a banjo, which are
